<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #070a13; color: #f1f5f9; }
    .glass-card { background: rgba(11, 15, 25, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
  </style>
</head>
<body class="font-sans antialiased min-h-screen">
  <main class="max-w-7xl mx-auto px-6 py-8">
    <section class="glass-card p-5 rounded-2xl">
      <h1 class="text-2xl font-extrabold mb-2">{{HEADER}}</h1>
      <p class="text-slate-300 mb-1">Dataset: {{DATASET_ID}}</p>
      <p class="text-slate-400 text-sm mb-4">Filas usadas: {{ROW_COUNT}} · Features: {{FEATURES}}</p>
      <p class="text-slate-400 text-sm mb-4">Sampling: {{SAMPLING_STATUS}} ({{SAMPLING_STRATEGY}})</p>

      <h2 class="text-xl font-semibold mt-6">Ranking (TVD)</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm mt-2 border border-slate-800">
          <thead><tr class="bg-slate-900"><th class="p-2">ID</th><th class="p-2">Experimento</th><th class="p-2">TVD</th><th class="p-2">A|I|B</th></tr></thead>
          <tbody>{{RANKING_ROWS}}</tbody>
        </table>
      </div>

      <h2 class="text-xl font-semibold mt-6">Configuración embebida</h2>
      <pre class="text-xs bg-slate-900 p-4 rounded border border-slate-800 overflow-auto" id="payload"></pre>
    </section>
  </main>
  <script>
    const payload = {{PAYLOAD_JSON}};
    document.getElementById('payload').textContent = JSON.stringify(payload, null, 2);
  </script>
</body>
</html>
